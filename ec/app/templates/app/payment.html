{% extends "app/base.html" %}
{% block title %}Payment{% endblock title %}

{% block main-content %}
<div class="container">
    <div class="row mt-5">
        <div class="col-md-6 offset-md-3">
            <h3 class="text-center">M-Pesa Payment</h3>
            <hr>
            <form method="post" action="{% url 'initiate_payment' %}">
                {% csrf_token %}
                <div class="mb-3">
                    <label for="phone_number" class="form-label">Phone Number</label>
                    <input type="text" class="form-control" id="phone_number" name="phone_number" required>
                </div>
                <div class="mb-3">
                    <label for="amount" class="form-label">Amount</label>
                    <input type="text" class="form-control" id="amount" name="amount" value="{{ amount }}" readonly>
                </div>
                <input type="hidden" name="address_id" value="{{ address_id }}">
                <button type="submit" class="btn btn-success w-100">Pay with M-Pesa</button>
            </form>
        </div>
    </div>
</div>
{% endblock main-content %}
